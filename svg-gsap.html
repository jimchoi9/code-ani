<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Version A — SVG + GSAP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #fdf6e9;
    color: #4a4038;
  }
  a.home {
    position: fixed; top: 16px; left: 16px; z-index: 50;
    background: #fff; border: 2px solid #4a4038; border-radius: 99px;
    padding: 6px 14px; font-size: .85rem; text-decoration: none; color: inherit;
  }

  /* 인트로 */
  .intro {
    height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    text-align: center;
  }
  .intro .scene-tag {
    background: #f2c94c; border: 2px solid #4a4038; border-radius: 99px;
    padding: 4px 16px; font-size: .85rem; font-weight: bold;
  }
  .intro h1 { font-size: 2.4rem; }
  .intro p { color: #8a7d6f; }
  .intro .arrow { font-size: 1.6rem; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(10px); } }

  /* 핀 고정되는 무대 */
  #stage {
    height: 100vh;
    position: relative;
    overflow: hidden;
  }
  #stage svg { width: 100%; height: 100%; display: block; }

  .caption {
    position: absolute;
    left: 50%;
    bottom: 9%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(255,255,255,.94);
    border: 3px solid #4a4038;
    border-radius: 16px;
    padding: 14px 26px;
    font-size: clamp(1rem, 2.4vw, 1.3rem);
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
  }

  /* 아웃트로 */
  .outro {
    min-height: 70vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    text-align: center; padding: 40px 20px;
  }
  .outro .scene-tag {
    background: #d0e6f7; border: 2px solid #4a4038; border-radius: 99px;
    padding: 4px 16px; font-size: .85rem; font-weight: bold;
  }
  .outro h2 { font-size: 1.8rem; }
  .outro p { color: #8a7d6f; }
</style>
</head>
<body>
<a class="home" href="index.html">← 목록</a>

<section class="intro">
  <span class="scene-tag">Scene 1</span>
  <h1>평화로운 우리 집</h1>
  <p>나비네 거실, 낮 · Version A — SVG + GSAP ScrollTrigger</p>
  <div class="arrow">▼</div>
</section>

<section id="stage">
  <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <!-- ===== 배경 ===== -->
    <rect x="0" y="0" width="800" height="480" fill="#dff0fa"/>
    <rect x="0" y="480" width="800" height="120" fill="#f5d9a3"/>
    <line x1="0" y1="480" x2="800" y2="480" stroke="#4a4038" stroke-width="4"/>

    <!-- 액자 -->
    <g>
      <rect x="120" y="150" width="110" height="88" rx="8" fill="#f2c94c" stroke="#4a4038" stroke-width="4"/>
      <rect x="134" y="164" width="82" height="60" rx="4" fill="#fdf6e9"/>
      <path d="M175 205 q-14-16 0-24 q14 8 0 24" fill="#e8574c"/>
    </g>

    <!-- 창문 (트럭은 유리 안쪽으로 클리핑) -->
    <g id="window">
      <rect x="545" y="130" width="190" height="160" rx="10" fill="#fff" stroke="#4a4038" stroke-width="5"/>
      <clipPath id="glassClip"><rect x="560" y="145" width="160" height="130" rx="6"/></clipPath>
      <rect x="560" y="145" width="160" height="130" rx="6" fill="#bfe3f2" stroke="#4a4038" stroke-width="3"/>
      <g clip-path="url(#glassClip)">
        <circle cx="596" cy="176" r="22" fill="#f2c94c"/>
        <ellipse cx="700" cy="182" rx="26" ry="12" fill="#fff" opacity=".9"/>
        <rect x="560" y="245" width="160" height="30" fill="#a8d68a"/>
        <!-- 이삿짐 트럭 (처음엔 오른쪽 바깥) -->
        <g id="truck" transform="translate(210,0)">
          <rect x="580" y="196" width="86" height="46" rx="6" fill="#e8574c" stroke="#4a4038" stroke-width="3"/>
          <rect x="666" y="210" width="34" height="32" rx="5" fill="#f2c94c" stroke="#4a4038" stroke-width="3"/>
          <rect x="672" y="216" width="18" height="13" rx="2" fill="#bfe3f2" stroke="#4a4038" stroke-width="2"/>
          <circle cx="602" cy="246" r="9" fill="#4a4038"/>
          <circle cx="676" cy="246" r="9" fill="#4a4038"/>
          <text x="596" y="224" font-size="13" font-weight="bold" fill="#fff">이사</text>
          <!-- 몽이 (트럭 짐칸에서 빼꼼) -->
          <g id="dog" transform="translate(0,26) scale(.01)" transform-origin="622 196">
            <ellipse cx="606" cy="176" rx="9" ry="15" fill="#8a5a34" stroke="#4a4038" stroke-width="2.5" transform="rotate(-18 606 176)"/>
            <ellipse cx="638" cy="176" rx="9" ry="15" fill="#8a5a34" stroke="#4a4038" stroke-width="2.5" transform="rotate(18 638 176)"/>
            <circle cx="622" cy="182" r="20" fill="#d9a86b" stroke="#4a4038" stroke-width="3"/>
            <circle cx="615" cy="178" r="2.6" fill="#4a4038"/>
            <circle cx="629" cy="178" r="2.6" fill="#4a4038"/>
            <ellipse cx="622" cy="188" rx="5" ry="4" fill="#4a4038"/>
            <rect x="606" y="196" width="32" height="9" rx="4.5" fill="#e8574c" stroke="#4a4038" stroke-width="2"/>
          </g>
        </g>
      </g>
      <line x1="640" y1="145" x2="640" y2="275" stroke="#4a4038" stroke-width="3"/>
      <line x1="560" y1="210" x2="720" y2="210" stroke="#4a4038" stroke-width="3"/>
    </g>

    <!-- 러그 -->
    <ellipse cx="300" cy="545" rx="230" ry="34" fill="#f4a7b0" opacity=".85"/>

    <!-- 화분 -->
    <g>
      <path d="M735 445 q-18-52 10-78 q4 44 14 78 z" fill="#7cb85c" stroke="#4a4038" stroke-width="3"/>
      <path d="M755 445 q22-40 2-72 q-14 38-16 72 z" fill="#98cc7a" stroke="#4a4038" stroke-width="3"/>
      <path d="M720 445 h58 l-8 42 h-42 z" fill="#e8955c" stroke="#4a4038" stroke-width="4"/>
    </g>

    <!-- ===== 나비 (고양이) ===== -->
    <g id="cat" transform="translate(240,455)">
      <!-- 꼬리 -->
      <g id="tail" transform-origin="76 8">
        <ellipse cx="84" cy="-32" rx="12" ry="46" fill="#f9e7c8" stroke="#4a4038" stroke-width="4" transform="rotate(14 84 8)"/>
        <circle cx="94" cy="-72" r="13" fill="#f0a04d" stroke="#4a4038" stroke-width="4"/>
      </g>
      <!-- 몸통 -->
      <ellipse cx="0" cy="0" rx="78" ry="56" fill="#f9e7c8" stroke="#4a4038" stroke-width="5"/>
      <ellipse cx="14" cy="10" rx="34" ry="26" fill="#f0a04d" opacity=".55"/>
      <!-- 앞발 -->
      <ellipse cx="-32" cy="50" rx="17" ry="13" fill="#f9e7c8" stroke="#4a4038" stroke-width="4"/>
      <ellipse cx="30" cy="50" rx="17" ry="13" fill="#f9e7c8" stroke="#4a4038" stroke-width="4"/>
      <!-- 머리 -->
      <g id="catHead" transform-origin="0 -70">
        <!-- 귀 -->
        <path d="M-38 -158 L-52 -196 L-12 -172 Z" fill="#f9e7c8" stroke="#4a4038" stroke-width="5" stroke-linejoin="round"/>
        <path d="M38 -158 L52 -196 L12 -172 Z" fill="#f9e7c8" stroke="#4a4038" stroke-width="5" stroke-linejoin="round"/>
        <path d="M-36 -166 L-44 -186 L-22 -172 Z" fill="#f4a7b0"/>
        <path d="M36 -166 L44 -186 L22 -172 Z" fill="#f4a7b0"/>
        <!-- 얼굴 -->
        <circle cx="0" cy="-122" r="56" fill="#f9e7c8" stroke="#4a4038" stroke-width="5"/>
        <circle cx="-18" cy="-130" r="5" fill="#4a4038"/>
        <circle cx="18" cy="-130" r="5" fill="#4a4038"/>
        <path d="M-6 -114 L6 -114 L0 -106 Z" fill="#e8888f"/>
        <path d="M0 -106 q-7 8 -13 3 M0 -106 q7 8 13 3" fill="none" stroke="#4a4038" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="-38" cy="-108" rx="9" ry="5.5" fill="#f4a7b0"/>
        <ellipse cx="38" cy="-108" rx="9" ry="5.5" fill="#f4a7b0"/>
        <!-- 수염 -->
        <g stroke="#4a4038" stroke-width="3" stroke-linecap="round">
          <line x1="-54" y1="-118" x2="-84" y2="-124"/>
          <line x1="-54" y1="-106" x2="-84" y2="-104"/>
          <line x1="54" y1="-118" x2="84" y2="-124"/>
          <line x1="54" y1="-106" x2="84" y2="-104"/>
        </g>
      </g>
      <!-- 목걸이 + 방울 -->
      <rect x="-34" y="-74" width="68" height="14" rx="7" fill="#e8574c" stroke="#4a4038" stroke-width="4"/>
      <g id="bell" transform-origin="0 -60">
        <circle cx="0" cy="-52" r="11" fill="#f2c94c" stroke="#4a4038" stroke-width="4"/>
        <circle cx="0" cy="-48" r="2.5" fill="#4a4038"/>
      </g>
    </g>

    <!-- 공 -->
    <g id="ball" transform="translate(370,502)">
      <circle cx="0" cy="0" r="34" fill="#e8574c" stroke="#4a4038" stroke-width="5"/>
      <path d="M-34 0 a34 34 0 0 1 68 0" fill="#f2c94c"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#4a4038" stroke-width="5"/>
      <line x1="-34" y1="0" x2="34" y2="0" stroke="#4a4038" stroke-width="4"/>
    </g>

    <!-- 말풍선 -->
    <g id="bubble" transform-origin="290 330" transform="scale(0)">
      <path d="M250 300 h130 a14 14 0 0 1 14 14 v34 a14 14 0 0 1 -14 14 h-90 l-22 22 4 -22 h-22 a14 14 0 0 1 -14 -14 v-34 a14 14 0 0 1 14 -14 z"
            fill="#fff" stroke="#4a4038" stroke-width="4"/>
      <text x="315" y="336" text-anchor="middle" font-size="22" font-weight="bold" fill="#4a4038">딸랑딸랑 ♪</text>
    </g>
  </svg>

  <!-- 자막 -->
  <div class="caption" id="cap1">나비는 새 장난감 공이 세상에서 제일 좋아요.</div>
  <div class="caption" id="cap2">방울 목걸이가 딸랑딸랑, 오늘도 신나는 하루!</div>
  <div class="caption" id="cap3">그때, 창밖으로 몽이네가 이사를 왔어요&hellip;</div>
</section>

<section class="outro">
  <span class="scene-tag">다음 이야기</span>
  <h2>Scene 2 — 갑작스러운 만남</h2>
  <p>빨간 스카프를 두른 몽이가 마당에 나타난다면?</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

/* 스크롤과 무관하게 항상 도는 아이들 모션 */
gsap.to("#tail", { rotation: 22, duration: 0.45, yoyo: true, repeat: -1, ease: "sine.inOut" });
gsap.to("#catHead", { rotation: 4, duration: 1.1, yoyo: true, repeat: -1, ease: "sine.inOut" });
gsap.to("#bell", { rotation: 14, duration: 0.3, yoyo: true, repeat: -1, ease: "sine.inOut" });

/* 스크롤 스크럽 타임라인 */
const tl = gsap.timeline({
  scrollTrigger: {
    trigger: "#stage",
    start: "top top",
    end: "+=4000",
    scrub: 1,
    pin: true,
  },
  defaults: { ease: "none" },
});

/* 1. 자막 1 */
tl.to("#cap1", { opacity: 1, y: 0, duration: 0.5 })
  .to("#cap1", { opacity: 0, duration: 0.4 }, "+=0.5");

/* 2. 공이 튀어 달아나고 나비가 폴짝폴짝 쫓아감 */
tl.to("#ball", {
    keyframes: [
      { x: 460, y: 440, rotation: 180 },
      { x: 540, y: 502, rotation: 360 },
      { x: 600, y: 460, rotation: 500 },
      { x: 660, y: 502, rotation: 640 },
    ],
    duration: 1.6,
  }, "chase")
  .to("#cat", {
    keyframes: [
      { x: 300, y: 420 },
      { x: 340, y: 455 },
      { x: 390, y: 420 },
      { x: 430, y: 455 },
    ],
    duration: 1.6,
  }, "chase");

/* 3. 말풍선 딸랑딸랑 */
tl.to("#bubble", { scale: 1, x: 160, duration: 0.5, ease: "back.out(2)" })
  .to("#cap2", { opacity: 1, y: 0, duration: 0.5 }, "<")
  .to(["#bubble"], { scale: 0, duration: 0.35 }, "+=0.6")
  .to("#cap2", { opacity: 0, duration: 0.4 }, "<");

/* 4. 공을 다시 데려오는 나비 */
tl.to("#ball", {
    keyframes: [
      { x: 560, y: 450, rotation: 500 },
      { x: 470, y: 502, rotation: 360 },
      { x: 400, y: 470, rotation: 250 },
      { x: 350, y: 502, rotation: 180 },
    ],
    duration: 1.2,
  }, "back")
  .to("#cat", {
    keyframes: [
      { x: 380, y: 420 },
      { x: 330, y: 455 },
      { x: 270, y: 420 },
      { x: 220, y: 455 },
    ],
    duration: 1.2,
  }, "back");

/* 5. 창밖 이삿짐 트럭 등장 → 몽이 빼꼼 */
tl.to("#truck", { x: -35, duration: 1.4, ease: "power1.out" })
  .to("#dog", { scale: 1, y: 0, duration: 0.5, ease: "back.out(1.7)" })
  .to("#cap3", { opacity: 1, y: 0, duration: 0.6 }, "<+0.2")
  .to({}, { duration: 0.8 }); /* 여운 */
</script>
</body>
</html>
